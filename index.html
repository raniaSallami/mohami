<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>المحامي | منصة الذكاء الاصطناعي القانونية</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@300;400;500;600;700;800&family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Tajawal:wght@200;300;400;500;700;800&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', 'Outfit', 'Tajawal', 'sans-serif'],
              serif: ['Playfair Display', 'serif'],
            },
            colors: {
              primary: '#D4941C',
              'primary-foreground': '#ffffff',
              background: '#ffffff',
              foreground: '#000000',
              card: '#f5f5f5',
              'card-foreground': '#000000',
              popover: '#ffffff',
              'popover-foreground': '#000000',
              muted: '#e5e5e5',
              'muted-foreground': '#666666',
              accent: '#E5A52D',
              'accent-foreground': '#000000',
              destructive: '#ef4444',
              'destructive-foreground': '#ffffff',
              border: '#e5e5e5',
              input: '#e5e5e5',
              ring: '#D4941C',
              secondary: '#f0f0f0',
              'secondary-foreground': '#000000',
              gold: {
                300: '#E2C778',
                400: '#D4AF37',
                500: '#C9A34E',
                600: '#B89645',
              },
              deepblack: '#0B0B0B',
              night: '#0F172A',
              offwhite: '#F8F8F8',
            },
            animation: {
              'spin-slow': 'spin 3s linear infinite',
            },
            backgroundColor: {
              DEFAULT: 'hsl(var(--background))',
            },
            textColor: {
              DEFAULT: 'hsl(var(--foreground))',
            },
            borderColor: {
              DEFAULT: 'hsl(var(--border))',
            }
          },
        },
      }
    </script>
    <style>
      :root {
        --primary: #D4941C;
        --primary-light: #E5A52D;
        --primary-dark: #B8821A;
        --gold-primary: #D4941C;
        --gold-light: #E5A52D;
        --gold-dark: #B8821A;
        --deep-black: #050505;
        --night-blue: #0A0F1E;
        --cream: #FDFCF8;
        --background: #ffffff;
        --foreground: #000000;
        --card: #f5f5f5;
        --border: #e5e5e5;
        --muted-foreground: #666666;
      }
      
      html.dark {
        --background: #0f0f0f;
        --foreground: #ffffff;
        --card: #1a1a1a;
        --border: #333333;
        --muted-foreground: #a0a0a0;
      }
      
      @font-face {
        font-family: 'Playfair Display';
        font-style: normal;
        font-weight: 400;
        font-display: swap;
        src: url(https://fonts.gstatic.com/s/playfairdisplay/v37/nuFvD7K3a7m27pL-mme6uRE.woff2) format('woff2');
      }

      html {
        scroll-behavior: smooth;
        -webkit-tap-highlight-color: transparent;
        transition: font-family 0.3s ease;
      }
      
      /* ===== ARABIC (RTL) ===== */
      body {
        font-family: 'Inter', 'Tajawal', sans-serif;
        background-color: var(--background);
        color: var(--foreground);
        transition: background-color 1s cubic-bezier(0.4, 0, 0.2, 1), color 1s cubic-bezier(0.4, 0, 0.2, 1);
        text-rendering: optimizeLegibility;
        -webkit-font-smoothing: antialiased;
        overflow-x: hidden;
      }
      
      body.dark {
        background-color: var(--background);
        color: var(--foreground);
      }
      
      h1, h2, h3, h4, h5, h6, .font-serif {
        font-family: 'Playfair Display', serif;
        letter-spacing: -0.01em;
      }

      /* ===== FRENCH (LTR) — font & direction overrides ===== */
      html[data-lang="fr"] body {
        font-family: 'Outfit', 'Plus Jakarta Sans', 'Inter', sans-serif;
        font-weight: 400;
        font-size: 15px;
        letter-spacing: 0.01em;
        word-spacing: 0.05em;
      }

      html[data-lang="fr"] h1,
      html[data-lang="fr"] h2,
      html[data-lang="fr"] h3,
      html[data-lang="fr"] h4,
      html[data-lang="fr"] h5,
      html[data-lang="fr"] h6 {
        font-family: 'Plus Jakarta Sans', 'Outfit', 'Playfair Display', serif;
        letter-spacing: -0.02em;
        font-weight: 700;
        line-height: 1.2;
      }

      html[data-lang="fr"] .font-serif {
        font-family: 'Playfair Display', serif;
        letter-spacing: 0;
      }

      /* French typography refinements */
      html[data-lang="fr"] p,
      html[data-lang="fr"] span,
      html[data-lang="fr"] label,
      html[data-lang="fr"] button {
        font-family: 'Outfit', 'Plus Jakarta Sans', sans-serif;
        font-feature-settings: 'liga' 1, 'calt' 1;
      }

      html[data-lang="fr"] input,
      html[data-lang="fr"] textarea,
      html[data-lang="fr"] select {
        font-family: 'Plus Jakarta Sans', 'Outfit', sans-serif;
        font-size: 14px;
      }

      /* Navigation items in LTR */
      html[dir="ltr"] .space-x-reverse > :not([hidden]) ~ :not([hidden]) {
        --tw-space-x-reverse: 0;
      }
      
      /* Advanced Glassmorphism */
      .glass {
        background: rgba(255, 255, 255, 0.4);
        backdrop-filter: blur(20px) saturate(200%);
        -webkit-backdrop-filter: blur(20px) saturate(200%);
        border: 1px solid rgba(255, 255, 255, 0.3);
      }
      html.dark .glass {
        background: rgba(10, 15, 30, 0.4);
        border: 1px solid rgba(255, 255, 255, 0.08);
      }
      
      /* Shimmer Effect */
      .shimmer {
        position: relative;
        overflow: hidden;
      }
      .shimmer::after {
        content: "";
        position: absolute;
        top: 0;
        right: 0;
        bottom: 0;
        left: 0;
        background: linear-gradient(
          90deg,
          rgba(255, 255, 255, 0) 0%,
          rgba(255, 255, 255, 0.1) 50%,
          rgba(255, 255, 255, 0) 100%
        );
        transform: translateX(-100%);
        animation: shimmer 3s infinite;
      }
      @keyframes shimmer {
        100% { transform: translateX(100%); }
      }

      /* Gold Text Shimmer */
      .text-shimmer {
        background: linear-gradient(90deg, #C9A34E, #FDFCF8, #C9A34E);
        background-size: 200% auto;
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
        animation: textShimmer 4s linear infinite;
      }
      @keyframes textShimmer {
        to { background-position: 200% center; }
      }

      /* Luxury Background Mesh */
      .bg-mesh {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: -1;
        background: radial-gradient(circle at 0% 0%, rgba(201, 163, 78, 0.08) 0%, transparent 50%),
                    radial-gradient(circle at 100% 100%, rgba(14, 165, 233, 0.05) 0%, transparent 50%),
                    var(--cream);
        transition: background 1s ease;
      }
      html.dark .bg-mesh {
        background: radial-gradient(circle at 0% 0%, rgba(201, 163, 78, 0.15) 0%, transparent 50%),
                    radial-gradient(circle at 100% 0%, rgba(30, 41, 59, 0.4) 0%, transparent 50%),
                    var(--deep-black);
      }

      /* Custom scrollbar */
      ::-webkit-scrollbar { width: 4px; }
      ::-webkit-scrollbar-track { background: transparent; }
      ::-webkit-scrollbar-thumb {
        background: #C9A34E80;
        border-radius: 10px;
      }
      ::-webkit-scrollbar-thumb:hover { background: #C9A34E; }
      
      .premium-card {
        transition: all 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        border: 1px solid rgba(201, 163, 78, 0.1);
      }
      .premium-card:hover {
        transform: translateY(-12px) scale(1.02);
        border-color: rgba(201, 163, 78, 0.4);
        box-shadow: 0 40px 100px -20px rgba(0, 0, 0, 0.2);
      }
      html.dark .premium-card:hover {
        box-shadow: 0 40px 100px -20px rgba(0, 0, 0, 0.6), 0 0 30px rgba(201, 163, 78, 0.1);
      }

      @keyframes reveal {
        from { transform: translateY(100%); opacity: 0; }
        to { transform: translateY(0); opacity: 1; }
      }
      .animate-reveal { animation: reveal 1.2s cubic-bezier(0.16, 1, 0.3, 1) forwards; }

      /* Force solid backgrounds on UI overlays */
      [data-dropdown-container] {
        background-color: #ffffff !important;
        opacity: 1 !important;
        backdrop-filter: none !important;
        -webkit-backdrop-filter: none !important;
      }
      html.dark [data-dropdown-container] {
        background-color: #0f172a !important;
      }
    </style>

  if (localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {

  } else {

  }
